// ---- AI photo estimate (v40, Gate 3) ----
// Photo -> /api/analyze-food -> items loaded into the OPEN meal editor as
// editable rows. Nothing is saved until the user taps Save; an AI guess is
// never written on its own. The photo lives only in local variables and is
// never stored or synced. The server authenticates with this device's sync
// code (see analyze-food.js), so photo analysis needs Sync set up.
const AI_PHOTO_MAX_EDGE = 1280;                // px, long edge after resizing
const AI_PHOTO_MAX_BYTES = 3 * 1024 * 1024;    // after compression; server cap is 4 MB
const AI_TIMEOUT_MS = 60000;

function renderAiBox(d){
  const ai = d.ai || {};
  let h = '<div class="food-ai-box">';
  if (ai.status === 'busy'){
    h += '<div class="food-ai-status">⏳ Analysing photo…</div>';
  } else {
    h += '<button class="btn btn-secondary food-ai-btn" data-act="meal-photo">📷 ' + (ai.status === 'done' ? 'Estimate another photo' : 'Estimate from photo') + '</button>'
      + '<input type="file" accept="image/*" data-input="meal-photo-file" class="food-ai-file" hidden>'
      + '<input class="form-input" data-input="meal-ai-desc" placeholder="Optional: what it is, brands, weights" value="' + esc(ai.desc || '') + '">';
  }
  if (ai.status === 'done'){
    h += '<div class="food-ai-banner">AI estimate added below (' + ai.count + ' item' + (ai.count === 1 ? '' : 's') + '). '
      + 'Check every name and number — nothing is saved until you tap Save.</div>';
    const notes = (ai.warnings || []).map(w => '⚠️ ' + w).concat((ai.assumptions || []).map(a => 'Assumed: ' + a));
    if (notes.length) h += '<ul class="food-ai-notes">' + notes.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul>';
  }
  if (ai.status === 'error') h += '<div class="food-ai-error">' + esc(ai.message || 'Photo analysis failed.') + '</div>';
  return h + '</div>';
}

function startMealPhoto(){
  if (!window._mealEditor) return;
  if (!syncKey()){ toast('Set up ☁️ Sync first — photo analysis uses your sync code to prove it\'s you'); return; }
  if (navigator.onLine === false){ toast('📴 Photo analysis needs internet'); return; }
  const input = document.querySelector('#modal .food-ai-file');
  if (input) input.click();
}

// Resize and re-encode on the phone: a 12 MP photo becomes ~0.2–0.5 MB JPEG,
// which uploads fast and is plenty for the model. Also strips location metadata.
async function compressPhoto(file){
  if (!file || !/^image\//.test(file.type || '')) throw new Error('That file isn\'t a photo.');
  if (file.size > 30 * 1024 * 1024) throw new Error('That photo is too large.');
  let src, w, h, cleanup = () => {};
  try {
    src = await createImageBitmap(file, { imageOrientation: 'from-image' });
    w = src.width; h = src.height; cleanup = () => src.close && src.close();
  } catch (e) {
    const url = URL.createObjectURL(file);
    src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; })
      .catch(() => { throw new Error('Couldn\'t read that photo. Try a JPEG or PNG.'); })
      .finally(() => URL.revokeObjectURL(url));
    w = src.naturalWidth; h = src.naturalHeight;
  }
  const scale = Math.min(1, AI_PHOTO_MAX_EDGE / Math.max(w, h));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(w * scale)); canvas.height = Math.max(1, Math.round(h * scale));
  canvas.getContext('2d').drawImage(src, 0, 0, canvas.width, canvas.height);
  cleanup();
  for (const q of [0.82, 0.65, 0.5]){
    const url = canvas.toDataURL('image/jpeg', q);
    if (url.length * 3 / 4 <= AI_PHOTO_MAX_BYTES) return url;
  }
  throw new Error('That photo is too large.');
}

async function requestFoodAnalysis(photoDataUrl, description){
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), AI_TIMEOUT_MS) : null;
  let r, body = null;
  try {
    r = await fetch('/api/analyze-food', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Sync-Key': syncKey() },
      body: JSON.stringify({ photoBase64: photoDataUrl, description: (description || '').slice(0, 500) }),
      signal: ctrl ? ctrl.signal : undefined,
    });
  } catch (e) {
    throw new Error(e && e.name === 'AbortError' ? 'Photo analysis took too long. Try again.' : 'Couldn\'t reach the server. Check your connection.');
  } finally { if (timer) clearTimeout(timer); }
  try { body = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((body && typeof body.message === 'string' && body.message.slice(0, 200)) || 'Photo analysis failed (' + r.status + ').');
  if (!body || !Array.isArray(body.items) || !body.items.length) throw new Error('No food was recognised in that photo.');
  return body;
}

// Load a result into the editor as ordinary editable rows. Re-validated here
// too: the client never trusts the response shape any more than the server
// trusts the model's.
function applyAiResult(d, result){
  const clampNum = (v, max) => { const n = Number(v); return (isFinite(n) && n >= 0) ? Math.round(Math.min(n, max) * 10) / 10 : 0; };
  const str = (v, n) => (typeof v === 'string' ? v.replace(/\s+/g, ' ').trim().slice(0, n) : '');
  const rows = (result.items || []).slice(0, 25).map(i => ({
    id: foodUid('i'), name: str(i && i.name, 80) || 'Item',
    kcal: clampNum(i && i.kcal, 5000), proteinG: clampNum(i && i.proteinG, 500), carbsG: clampNum(i && i.carbsG, 1000),
    fatG: clampNum(i && i.fatG, 500), grams: clampNum(i && i.grams, 5000),
    source: 'ai', confidence: ['low','medium','high'].includes(i && i.confidence) ? i.confidence : 'low',
    notes: str(i && i.notes, 200)
  }));
  // Replace the untouched starter row; otherwise add to what's already there.
  const blank = it => !(it.name || '').trim() && !['kcal','proteinG','carbsG','fatG','grams'].some(k => it[k] !== '' && it[k] != null && Number(it[k]) !== 0);
  const kept = (d.items || []).filter(it => !blank(it));
  d.items = kept.concat(rows);
  d.aiUsed = true;
  const list = v => (Array.isArray(v) ? v : []).map(s => str(s, 200)).filter(Boolean).slice(0, 8);
  d.ai = { status: 'done', desc: (d.ai && d.ai.desc) || '', count: rows.length,
           warnings: list(result.warnings), assumptions: list(result.assumptions) };
}

async function onMealPhotoChosen(input){
  const d = window._mealEditor;
  const file = input.files && input.files[0];
  input.value = '';
  if (!d || !file) return;
  const desc = (d.ai && d.ai.desc) || '';
  d.ai = { status: 'busy', desc };
  renderMealEditor();
  try {
    const photo = await compressPhoto(file);
    const result = await requestFoodAnalysis(photo, desc);
    if (window._mealEditor !== d) return;          // editor closed or replaced meanwhile: drop it
    applyAiResult(d, result);
  } catch (e) {
    if (window._mealEditor !== d) return;
    d.ai = { status: 'error', desc, message: (e && e.message) || 'Photo analysis failed.' };
  }
  renderMealEditor();
}

function recipeSaveDraft(){

  const bad = foodRowsError(d.ingredients || [], 'Ingredient');
  if (bad){ toast('⚠️ ' + bad); return; }
  // Optional numbers: blank = not set; otherwise must be above 0.
  const optPos = (v, max) => { if (v === '' || v == null) return null; const n = Number(v); return (isFinite(n) && n > 0 && n <= max) ? n : NaN; };
  const cooked = optPos(d.cookedWeightG, 100000);

  for (const it of (d.ingredients || [])){

  }
  // Keep fields beyond the known ones (same reason as mealSaveDraft).

    if (p) ing.portions = p; else delete ing.portions;

function exportCSV(){
  const rows = [['Date','Day','Type','Block','Exercise','Muscle','Weight','S1','S2','S3','S4','S5','S6','Done','Weight increased','Day Notes','Ex Notes']];
  const dates = Object.keys(S().sessionLog).concat(Object.keys(S().dayTypes));
  [...new Set(dates)].sort().forEach(ds => {
    const type = getDayType(ds);
    const logged = hasLog(ds);
    // A day reading as Rest but still holding logged sets is an unpinned
    // workout, not a rest day. Exporting on type alone hid real data.
    if (type === 'Rest' && !logged) return;
    // getPlan() returns null for Rest, so fall back to a stored plan, then to
    // whatever indices the session log actually has.
    const plan = getPlan(ds) || S().dayPlans[ds] || [];
    const sl = S().sessionLog[ds] || {};
    const idxs = plan.length ? plan.map((_, i) => i)
                             : Object.keys(sl).map(Number).sort((a, b) => a - b);
    const dn = S().dayNotes[ds] || '';
    const label = (type === 'Rest' && logged) ? 'Unpinned (has logged data)' : type;
    idxs.forEach(i => {
      const ex = plan[i] || {};
      const s = peekSession(ds, i) || {};
      const r = s.reps || [];
      rows.push([ds, DAY_NAMES[dowOf(ds)], label, isGymDay(ds) ? type.slice(-1) : blockInfo(ds).variant,
        ex.exercise || '(unknown — plan not stored)', ex.muscle || '',
        s.weight || (ex.exercise ? getWeight(ds, i, ex.exercise) : ''),
        r[0] ?? '', r[1] ?? '', r[2] ?? '', r[3] ?? '', r[4] ?? '', r[5] ?? '',
        s.done ? 'Yes' : '', s.progressed ? 'Yes' : '', dn,
        (S().exNotes[ds] && S().exNotes[ds][i]) || '']);
    });
  });
  const csv = rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g,'""') + '"').join(',')).join('\n');
  const url = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'billys-workout' + (workoutMode === 'travel' ? '-travel' : '') + '-' + todayStr() + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV downloaded!');
}

// ==========================================
// BACKUP / RESTORE
// ==========================================
// CSV is a report, not a backup — it's lossy and one-way. These two move the
// whole state between devices, and are the only way Billy's history survives a
// lost phone. Both modes (gym + travel) travel together; localStorage is
// per-device with no sync, so this file IS the transfer mechanism.
const BACKUP_TAG = 'billys-workout';
const RESTORE_SAFETY_KEY = LS_KEY + '_pre_restore';

function exportBackup(){
  let raw;
  try { raw = localStorage.getItem(LS_KEY); } catch(e){ raw = null; }
  if (!raw){ toast('Nothing to back up yet'); return; }
  let data;
  try { data = JSON.parse(raw); } catch(e){ toast('⚠️ Saved data is unreadable'); return; }

  const payload = {
    _backup: BACKUP_TAG,
    _backupVersion: 1,
    exportedAt: new Date().toISOString(),
    appVersion: 'v42',
    data,
  };
  const url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 1)], { type:'application/json' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'billys-workout-backup-' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('💾 Backup saved');
}

// Counts what's in a blob so the confirm prompt can show real numbers —
// restoring is destructive and "are you sure?" is useless without them.
function backupSummary(data){
  let days = 0, logged = 0;
  ['gym','travel'].forEach(m => {
    const s = (data.store && data.store[m]) || {};
    const log = s.sessionLog || {};
    Object.keys(log).forEach(ds => {
      days++;
      const d = log[ds] || {};
      if (Object.keys(d).some(k => { const e = d[k]||{}; return e.done || (e.reps||[]).some(r => r !== undefined && r !== null && r !== ''); })) logged++;
    });
  });
  return { days, logged };
}

function importBackup(input){
  const file = input.files && input.files[0];
  input.value = '';                                   // so re-picking the same file fires again
  if (!file) return;

  const reader = new FileReader();
  reader.onerror = () => toast('⚠️ Could not read that file');
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); }
    catch(e){ toast('⚠️ Not a valid backup file'); return; }

    // Accept the wrapped export, or a bare state blob pasted straight out of storage.
    const data = (parsed && parsed._backup === BACKUP_TAG && parsed.data) ? parsed.data : parsed;
    if (!data || typeof data !== 'object' || !data.store || !data._schemaVersion){
      toast('⚠️ That file is not a Billy\'s Workout backup');
      return;
    }

    const incoming = backupSummary(data);
    const current  = backupSummary({ store });
    const when = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString() : 'unknown date';
    const ok = confirm(
      'Restore this backup?\n\n' +
      'From: ' + when + '\n' +
      'Contains: ' + incoming.logged + ' logged workouts across ' + incoming.days + ' days, ' + countMeals(data) + ' meals\n\n' +
      'This REPLACES everything on this device (' + current.logged + ' logged workouts, ' + countMeals({ food }) + ' meals).\n' +
      'Your current data is kept as a one-time safety copy in case this was a mistake.'
    );
    if (!ok){ toast('Restore cancelled'); return; }

    try {
      const existing = localStorage.getItem(LS_KEY);
      if (existing) localStorage.setItem(RESTORE_SAFETY_KEY, existing);
      localStorage.setItem(LS_KEY, JSON.stringify(data));
    } catch(e){
      toast('⚠️ Restore failed — storage may be full');
      return;
    }
    // Reload rather than re-hydrating in place: loadState() merges into the
    // live PROGRESSION objects, so stale keys would survive a partial swap.
    location.reload();
  };
  reader.readAsText(file);
}

// ==========================================
// SUPABASE SYNC
// ==========================================
// Offline-first: localStorage stays the source of truth and nothing here ever
// blocks logging. If the network, the key, or the whole project is unavailable,
// the app works exactly as it did before sync existed — you just don't sync.
//
// The publishable key is public on purpose. Row-level security only returns a
// row when X-Sync-Key matches it, so the key alone gets an attacker nothing.
// The sync key is the real secret and lives only in localStorage.
const SB_URL      = 'https://sqmkjgubujrkxygsukng.supabase.co';
const SB_KEY      = 'sb_publishable_m6cjgKCi9ZwPUnlJWTUb3A_lGp67uNa';
const SYNC_KEY_LS = 'caprica_workout_sync_key';    // the shared secret
const SYNC_META_LS= 'caprica_workout_sync_meta';   // {syncedAt, dirty, lastSync}

function syncKey(){ try { return localStorage.getItem(SYNC_KEY_LS) || ''; } catch(e){ return ''; } }
function setSyncKeyValue(k){ try { localStorage.setItem(SYNC_KEY_LS, k); } catch(e){} }
function syncMeta(){ try { return JSON.parse(localStorage.getItem(SYNC_META_LS) || '{}'); } catch(e){ return {}; } }
function setSyncMeta(m){ try { localStorage.setItem(SYNC_META_LS, JSON.stringify(m)); } catch(e){} }

function newSyncKey(){
  const b = new Uint8Array(24);
  (crypto || window.crypto).getRandomValues(b);
  return 'bw-' + Array.from(b).map(x => x.toString(16).padStart(2,'0')).join('');
}

let syncState = { status:'idle', detail:'' };
function setSyncStatus(status, detail){
  syncState = { status, detail: detail || '' };
  const b = document.getElementById('sync-btn');
  if (b) b.textContent = ({ idle:'☁️ Sync', syncing:'⏳ Sync', ok:'✅ Sync',
                            offline:'📴 Sync', error:'⚠️ Sync', conflict:'⚠️ Sync' })[status] || '☁️ Sync';
}

function sbReq(path, opts){
  const o = opts || {};
  return fetch(SB_URL + '/rest/v1/' + path, Object.assign({}, o, {
    headers: Object.assign({
      apikey: SB_KEY,
      Authorization: 'Bearer ' + SB_KEY,
      'X-Sync-Key': syncKey(),
    }, o.headers || {})
  }));
}

function localBlob(){
  try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch(e){ return null; }
}

async function sbGetRow(){
  const r = await sbReq('workout_state?select=data,updated_at&limit=1');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const rows = await r.json();
  return rows[0] || null;
}

// Compare-and-swap: the PATCH is filtered on the updated_at we last saw, so if
// another device wrote in between, zero rows match and we detect it instead of
// clobbering. This is the whole conflict-safety mechanism — don't drop the
// updated_at filter to "simplify" the query.
async function sbPush(expectedUpdatedAt){
  const blob = localBlob();
  if (!blob) return { skipped:true };
  const common = { headers:{ 'Content-Type':'application/json', Prefer:'return=representation' } };
  if (!expectedUpdatedAt){
    const r = await sbReq('workout_state', Object.assign({ method:'POST',
      body: JSON.stringify({ sync_key: syncKey(), data: blob, device_note: (navigator.userAgent||'').slice(0,60) })
    }, common));
    if (r.status === 409) return { conflict:true };
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return { row: (await r.json())[0] };
  }
  const r = await sbReq('workout_state?sync_key=eq.' + encodeURIComponent(syncKey())
                        + '&updated_at=eq.' + encodeURIComponent(expectedUpdatedAt),
    Object.assign({ method:'PATCH', body: JSON.stringify({ data: blob }) }, common));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const rows = await r.json();
  return rows.length ? { row: rows[0] } : { conflict:true };
}

function applyRemote(remote){
  // A blob with no `food` key was written by a pre-v36 build that doesn't know
  // food exists — it is not a request to delete this device's food log. Keep
  // ours, and mark dirty so it goes back up and repairs the server copy.
  const data = Object.assign({}, remote.data);
  const mine = localBlob();
  const keptFood = !('food' in data) && !!(mine && mine.food);
  if (keptFood) data.food = mine.food;
  try {
    localStorage.setItem(LS_KEY + '_pre_restore', localStorage.getItem(LS_KEY) || '');
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  } catch(e){ setSyncStatus('error','could not write'); return; }
  setSyncMeta({ syncedAt: remote.updated_at, dirty: keptFood, lastSync: new Date().toISOString() });
  location.reload();   // same reason as importBackup — see that comment
}

let syncBusy = false, syncTimer = null;

function markSyncDirty(){
  if (!syncKey()) return;
  const m = syncMeta();
  if (!m.dirty){ m.dirty = true; setSyncMeta(m); }
}

function scheduleSync(){
  if (!syncKey()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncNow(true); }, 3000);
}

async function syncNow(silent){
  if (!syncKey()){ if (!silent) toast('Set up sync first'); return; }
  if (syncBusy) return;
  if (navigator.onLine === false){ setSyncStatus('offline'); if (!silent) toast('📴 Offline'); return; }
  syncBusy = true; setSyncStatus('syncing');
  try {
    const meta = syncMeta();
    const remote = await sbGetRow();

    if (!remote){                                        // first device to sync
      const res = await sbPush(null);
      if (res.conflict){ syncBusy = false; return syncNow(silent); }
      if (!res.skipped) setSyncMeta({ syncedAt: res.row.updated_at, dirty:false, lastSync:new Date().toISOString() });
    } else if (remote.updated_at === meta.syncedAt){      // server unchanged since we last saw it
      if (meta.dirty){
        const res = await sbPush(remote.updated_at);
        if (res.conflict){ setSyncStatus('conflict'); syncBusy = false; return openConflictModal(remote); }
        setSyncMeta({ syncedAt: res.row.updated_at, dirty:false, lastSync:new Date().toISOString() });
      } else {
        setSyncMeta(Object.assign(meta, { lastSync:new Date().toISOString() }));
      }
    } else {                                              // server moved on
      if (!meta.dirty){ applyRemote(remote); return; }
      setSyncStatus('conflict'); syncBusy = false; return openConflictModal(remote);
    }
    setSyncStatus('ok');
    if (!silent) toast('✅ Synced');
  } catch(e){
    setSyncStatus('error', e.message);
    if (!silent) toast('⚠️ Sync failed — ' + e.message);
  } finally { syncBusy = false; }
}

// Foreground re-check. Skipped while a modal is open: a clean pull reloads the
// page, which would throw away a half-typed meal or edit. The next resume, or
// the push after saving, catches up.
function resumeSync(){
  if (!syncKey()) return false;
  const ov = document.getElementById('modal-overlay');
  if (ov && ov.classList.contains('show')) return false;
  syncNow(true);
  return true;
}

function countWorkouts(blob){
  let n = 0;
  ['gym','travel'].forEach(m => {
    const log = ((blob && blob.store && blob.store[m]) || {}).sessionLog || {};
    Object.keys(log).forEach(ds => {
      const d = log[ds] || {};
      if (Object.keys(d).some(k => { const e=d[k]||{}; return e.done || (e.reps||[]).some(r => r!==undefined && r!==null && r!==''); })) n++;
    });
  });
  return n;
}

function countMeals(blob){
  const byDay = (blob && blob.food && blob.food.mealsByDay) || {};
  return Object.keys(byDay).reduce((n, ds) => n + ((byDay[ds] || []).length), 0);
}

// Both sides changed since the last sync. Never pick for the user — whichever
// way this goes, somebody's logged sets stop being the live copy.
function openConflictModal(remote){
  const local = localBlob();
  const mine = countWorkouts(local), theirs = countWorkouts(remote.data);
  const myMeals = countMeals(local), theirMeals = countMeals(remote.data);
  let h = '<h2>⚠️ Sync conflict</h2>';
  h += '<div class="sub">Both this device and another device changed since the last sync. Nothing has been overwritten.</div>';
  h += '<div class="rule">This device: <b>' + mine + '</b> logged workouts, <b>' + myMeals + '</b> meals<br>'
     + 'Other device: <b>' + theirs + '</b> logged workouts, <b>' + theirMeals + '</b> meals (saved ' + new Date(remote.updated_at).toLocaleString() + ')</div>';
  h += '<div class="prev-note">Whichever you discard is kept as a one-time safety copy on this device.</div>';
  h += '<button class="btn btn-secondary" onclick="resolveConflict(\'mine\')">Keep this device\'s version</button>';
  h += '<button class="btn btn-secondary" onclick="resolveConflict(\'theirs\')">Use the other device\'s version</button>';
  h += '<button class="btn" onclick="closeModal()">Decide later</button>';
  document.getElementById('modal').innerHTML = h;
  document.getElementById('modal-overlay').classList.add('show');
  window._conflictRemote = remote;
}

async function resolveConflict(which){
  const remote = window._conflictRemote;
  if (!remote) return closeModal();
  closeModal();
  if (which === 'theirs'){ applyRemote(remote); return; }
  try {
    setSyncStatus('syncing');
    const res = await sbPush(remote.updated_at);        // overwrite the server copy
    if (res.conflict){ toast('⚠️ Changed again — try Sync once more'); setSyncStatus('conflict'); return; }
    setSyncMeta({ syncedAt: res.row.updated_at, dirty:false, lastSync:new Date().toISOString() });
    setSyncStatus('ok'); toast('✅ This device kept');
  } catch(e){ setSyncStatus('error', e.message); toast('⚠️ Sync failed'); }
}

// ==========================================
// CUSTOM WORKOUTS
// ==========================================
// A named exercise list you can drop on any day. Deliberately NOT part of the
// Upper/Lower/Arms cycle — see isRotationType(). Stored per mode, because gym
// and travel draw on different exercise catalogues, and inside `store` so it
// rides along with backup, restore and sync for free.
function saveDayAsCustom(ds){
  const plan = getPlan(ds);
  if (!plan || !plan.length){ toast('Nothing to save on this day'); return; }
  const cur = getDayType(ds);
  const name = (prompt('Name this workout\n\ne.g. Conditioning, Legs + Core',
                       isCustomType(cur) ? cur : '') || '').trim();
  if (!name) return;
  if (RESERVED_TYPES.indexOf(name) !== -1){ toast('That name is reserved'); return; }
  if (name.length > 24){ toast('Keep the name under 25 characters'); return; }
  const s = S();
  s.customTypes = s.customTypes || {};
  const existed = !!s.customTypes[name];
  if (existed && !confirm('"' + name + '" already exists.\n\nReplace its exercise list with this day\'s?')) return;
  s.customTypes[name] = plan.map(e => Object.assign({},e));
  saveState();
  closeModal();
  toast((existed ? 'Updated ' : 'Saved ') + name);
}

// Handlers take an index into _ctNames rather than the name itself — names are
// user-typed and would need escaping inside an onclick attribute.
function openCustomTypesModal(){
  const ct = customTypes();
  const names = Object.keys(ct).sort();
  window._ctNames = names;
  let h = '<h2>Custom workouts</h2>';
  h += '<div class="sub">' + (workoutMode === 'travel' ? 'Travel' : 'Gym') + ' mode — each mode keeps its own.</div>';
  h += '<button class="btn btn-primary" onclick="newCustomWorkout()">+ New custom workout</button>';
  if (!names.length){
    h += '<div class="rule">None yet. Tap <b>New custom workout</b> above to build one from a blank list, '
       + 'or set up any workout day and tap <b>Save as custom workout</b> to keep it.</div>';
  } else {
    names.forEach((n, i) => {
      const used = Object.keys(S().dayTypes).filter(ds => S().dayTypes[ds] === n).length;
      h += '<div class="form-group">';
      h += '<label class="form-label" style="color:' + CUSTOM_COLOR + '">' + esc(n) + '</label>';
      h += '<div class="sub">' + ct[n].length + ' exercises · on ' + used + ' day' + (used === 1 ? '' : 's') + '</div>';
      h += '<button class="btn btn-secondary" onclick="openTemplateEditor(window._ctNames[' + i + '])">Edit exercises</button>';
      h += '<button class="btn btn-secondary" onclick="renameCustomType(' + i + ')">Rename</button>';
      h += '<button class="btn btn-danger" onclick="deleteCustomType(' + i + ')">Delete</button>';
      h += '</div>';
    });
  }
  h += '<button class="btn btn-secondary" onclick="closeModal()">Close</button>';
  document.getElementById('modal').innerHTML = h;
  document.getElementById('modal-overlay').classList.add('show');
}

// Build a workout from nothing. The alternative — start from an Upper day and
// delete six exercises — is backwards when the new workout has nothing in
// common with the templates.
function newCustomWorkout(){
  const name = (prompt('Name your new workout\n\ne.g. Conditioning, Legs + Core') || '').trim();
  if (!name) return;
  if (RESERVED_TYPES.indexOf(name) !== -1){ toast('That name is reserved'); return; }
  if (name.length > 24){ toast('Keep the name under 25 characters'); return; }
  const s = S();
  s.customTypes = s.customTypes || {};
  if (s.customTypes[name]){ toast('You already have one called that'); return; }
  s.customTypes[name] = [];
  saveState();
  openTemplateEditor(name);
}

// Edits the saved template, not a day. Simpler than the day editor because a
// template has no reps, weights or progression to keep in step — just the
// exercise, its muscle group and how many sets.
// The name is held in _ctEditing rather than passed through onclick attributes,
// since it's user-typed and would need escaping.
function openTemplateEditor(name){
  const list = customTypes()[name];
  if (!list){ toast('That workout no longer exists'); return closeModal(); }
  window._ctEditing = name;
  let h = '<h2>' + esc(name) + '</h2>';
  h += '<div class="sub">' + (workoutMode === 'travel' ? 'Travel' : 'Gym') + ' mode · '
     + list.length + ' exercise' + (list.length === 1 ? '' : 's') + '</div>';
  if (!list.length){
    h += '<div class="rule">Empty so far. Add the exercises you want — this is the list you get '
       + 'every time you put <b>' + esc(name) + '</b> on a day.</div>';
  }
  list.forEach((ex, i) => {
    h += '<div class="form-group">';
    h += '<label class="form-label">' + esc(ex.exercise) + '</label>';
    h += '<div class="sub">' + esc(ex.muscle) + '</div>';
    h += '<div class="sets-controls">';
    h += '<button class="sets-btn" onclick="changeTemplateSets(' + i + ',-1)">−</button>';
    h += '<span class="sets-num">' + ex.sets + ' sets</span>';
    h += '<button class="sets-btn" onclick="changeTemplateSets(' + i + ',1)">+</button>';
    h += '<button class="btn btn-danger" onclick="removeFromTemplate(' + i + ')">Remove</button>';
    h += '</div></div>';
  });
  h += '<button class="btn btn-primary" onclick="openAddToTemplate()">+ Add exercise</button>';
  h += '<button class="btn btn-secondary" onclick="openCustomTypesModal()">Done</button>';
  document.getElementById('modal').innerHTML = h;
  document.getElementById('modal-overlay').classList.add('show');
}

function openAddToTemplate(){
  const name = window._ctEditing;
  if (!name || !customTypes()[name]) return closeModal();
  const groups = Object.keys(getExByGroup()).sort();
  let h = '<h2>Add to ' + esc(name) + '</h2>';
  h += '<div class="form-group"><label class="form-label">Muscle Group</label>';
  h += '<select class="form-select" id="add-group" onchange="updateAddExercises()">'
     + groups.map(g => '<option value="' + g + '">' + g + '</option>').join('') + '</select></div>';
  h += '<div class="form-group"><label class="form-label">Exercise</label>';
  h += '<select class="form-select" id="add-exercise"></select></div>';
  h += '<div class="form-group"><label class="form-label">Sets</label><div class="sets-controls">';
  h += '<button class="sets-btn" onclick="modAddSets(-1)">−</button>';
  h += '<span class="sets-num" id="add-sets-num">3</span>';
  h += '<button class="sets-btn" onclick="modAddSets(1)">+</button></div></div>';
  h += '<button class="btn btn-primary" onclick="doAddToTemplate()">Add</button>';
  h += '<button class="btn btn-secondary" onclick="openTemplateEditor(window._ctEditing)">Cancel</button>';
  document.getElementById('modal').innerHTML = h;
  document.getElementById('modal-overlay').classList.add('show');
  updateAddExercises();
  window._addSets = 3;
}

function doAddToTemplate(){
  const name = window._ctEditing, s = S();
  if (!name || !s.customTypes || !s.customTypes[name]) return;
  s.customTypes[name].push({
    muscle:   document.getElementById('add-group').value,
    exercise: document.getElementById('add-exercise').value,
    sets:     window._addSets || 3,
  });
  saveState();
  openTemplateEditor(name);
}

function changeTemplateSets(i, d){
  const name = window._ctEditing, s = S();
  const l = s.customTypes && s.customTypes[name];
  if (!l || !l[i]) return;
  l[i].sets = Math.max(1, Math.min(6, l[i].sets + d));
  saveState();
  openTemplateEditor(name);
}

function removeFromTemplate(i){
  const name = window._ctEditing, s = S();
  const l = s.customTypes && s.customTypes[name];
  if (!l || !l[i]) return;
  l.splice(i, 1);
  saveState();
  openTemplateEditor(name);
}

function renameCustomType(i){
  const old = (window._ctNames || [])[i];
  if (!old) return;
  const name = (prompt('Rename "' + old + '" to:', old) || '').trim();
  if (!name || name === old) return;
  if (RESERVED_TYPES.indexOf(name) !== -1){ toast('That name is reserved'); return; }
  if (name.length > 24){ toast('Keep the name under 25 characters'); return; }
  const s = S();
  if (s.customTypes[name]){ toast('You already have one called that'); return; }
  s.customTypes[name] = s.customTypes[old];
  delete s.customTypes[old];
  Object.keys(s.dayTypes).forEach(ds => { if (s.dayTypes[ds] === old) s.dayTypes[ds] = name; });
  invalidateProjection(); saveState();
  closeModal(); openCustomTypesModal();
  toast('Renamed to ' + name);
}

function deleteCustomType(i){
  const name = (window._ctNames || [])[i];
  if (!name) return;
  const s = S();
  const days = Object.keys(s.dayTypes).filter(ds => s.dayTypes[ds] === name);
  if (!confirm('Delete "' + name + '"?\n\n' + days.length + ' day(s) use it. They keep their exercises '
             + 'and any logged sets — only the saved template goes.')) return;
  // Freeze the list onto those days before the template disappears. Same trap
  // as unpinning a logged day: otherwise the reps survive with nothing naming
  // the exercises they belong to.
  days.forEach(ds => {
    if (!s.dayPlans[ds]){
      const p = (s.customTypes[name] || []).map(e => Object.assign({},e));
      if (p.length) s.dayPlans[ds] = p;
    }
  });
  delete s.customTypes[name];
  invalidateProjection(); saveState();
  closeModal(); render();
  toast('Deleted ' + name);
}

function openSyncModal(){
  const k = syncKey(), m = syncMeta();
  let h = '<h2>☁️ Sync</h2>';
  if (!k){
    h += '<div class="sub">Not set up on this device.</div>';
    h += '<div class="rule">On your <b>first</b> device, create a sync code. On any other device, paste that same code here — that is what links them.</div>';
    h += '<button class="btn btn-secondary" onclick="setupSyncNew()">Create a sync code</button>';
    h += '<div class="form-group"><label class="form-label">…or paste an existing code</label>'
       + '<input class="form-select" id="sync-key-input" placeholder="bw-…"></div>';
    h += '<button class="btn btn-secondary" onclick="setupSyncExisting()">Link this device</button>';
  } else {
    const last = m.lastSync ? new Date(m.lastSync).toLocaleString() : 'never';
    const stale = m.lastSync && (Date.now() - new Date(m.lastSync).getTime()) > 7*864e5;
    h += '<div class="sub">Last synced: ' + last + (stale ? ' — that is over a week ago' : '') + '</div>';
    if (syncState.status === 'error') h += '<div class="prev-note">Last attempt failed: ' + esc(syncState.detail) + '</div>';
    h += '<div class="rule">Unsynced changes on this device: <b>' + (m.dirty ? 'yes' : 'no') + '</b></div>';
    h += '<div class="form-group"><label class="form-label">Sync code (same on every device)</label>'
       + '<input class="form-select" id="sync-key-show" value="' + esc(k) + '" readonly onclick="this.select()"></div>';
    h += '<button class="btn btn-secondary" onclick="closeModal(); syncNow(false)">Sync now</button>';
    h += '<button class="btn btn-danger" onclick="unlinkSync()">Unlink this device</button>';
  }
  h += '<button class="btn" onclick="closeModal()">Close</button>';
  document.getElementById('modal').innerHTML = h;
  document.getElementById('modal-overlay').classList.add('show');
}

function setupSyncNew(){
  setSyncKeyValue(newSyncKey());
  setSyncMeta({ dirty:true });
  closeModal(); openSyncModal();
  syncNow(false);
}
function setupSyncExisting(){
  const v = (document.getElementById('sync-key-input').value || '').trim();
  if (v.length < 20){ toast('⚠️ That code looks too short'); return; }
  setSyncKeyValue(v);
  setSyncMeta({ dirty:false });        // pull theirs rather than push ours
  closeModal();
  syncNow(false);
}
function unlinkSync(){
  if (!confirm('Stop syncing this device?\n\nYour workouts stay on this device and on the server. Nothing is deleted.')) return;
  try { localStorage.removeItem(SYNC_KEY_LS); localStorage.removeItem(SYNC_META_LS); } catch(e){}
  setSyncStatus('idle'); closeModal(); toast('Sync unlinked');
}

// ==========================================
// TOAST
// ==========================================
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

document.getElementById('modal-overlay').addEventListener('click', function(e){
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && document.getElementById('modal-overlay').classList.contains('show')) closeModal();
});

// ==========================================
// PWA INSTALL
// ==========================================
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-btn').classList.remove('hidden');
});
window.addEventListener('appinstalled', () => {
  document.getElementById('install-btn').classList.add('hidden');
  deferredPrompt = null;
  toast('App installed! 🎉');
});
function installApp(){
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(r => {
    if (r.outcome === 'accepted') document.getElementById('install-btn').classList.add('hidden');
    deferredPrompt = null;
  });
}
if (/iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase())
    && !(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone)){
  document.getElementById('ios-guide').classList.add('show');
  document.getElementById('install-btn').classList.add('hidden');
}

window.addEventListener('scroll', updateScrollTodayBtn, { passive:true });

// ==========================================
// INIT
// ==========================================
loadState();
document.querySelectorAll('.mode-seg').forEach(b => b.classList.toggle('active', b.dataset.mode === workoutMode));
document.querySelectorAll('.view-seg').forEach(b => b.classList.toggle('active', b.dataset.view === viewState.mode));
document.querySelectorAll('.section-seg').forEach(b => b.classList.toggle('active', b.dataset.section === viewState.section));
['view-bar','mode-toggle'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.style.display = viewState.section === 'workout' ? '' : 'none';
});
render();

if (syncKey()){
  setSyncStatus('idle');
  syncNow(true);                                   // pull anything newer on open
  window.addEventListener('online', () => syncNow(true));
}
// Re-check whenever the app comes back to the foreground. A phone PWA resumed
// from the background, or a laptop tab left open, never re-runs the open-time
// pull — so it sat on stale data until its next edit collided with the other
// device's as a conflict.
// Going to the background flushes a pending push now instead of waiting out
// the 3s debounce, which a locked phone may never finish.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') resumeSync();
  else if (syncKey() && syncMeta().dirty){ clearTimeout(syncTimer); syncNow(true); }
});

if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w && w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) toast('🔄 Update ready — reopen the app');
      });
    });
    reg.update();
  }).catch(() => {});
}
